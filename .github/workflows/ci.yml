name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      cookbook: ${{ steps.filter.outputs.cookbook }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            swift:
              - "**/*.swift"
              - "agtermCore/**"
              - "agterm/**"
              # the agent skill and its plugin manifests: SkillInstallTests reads
              # them, so a skill- or manifest-only change must still run the suite
              - "plugins/**"
              - ".claude-plugin/**"
              - ".agents/**"
              - "project.yml"
              - "scripts/**"
              - ".swiftlint.yml"
              - "agtermTests/.swiftlint.yml"
              - "agtermUITests/.swiftlint.yml"
              - ".github/workflows/ci.yml"
            cookbook:
              - "cookbook/**"
              - ".github/workflows/ci.yml"

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: swift test (with coverage)
        working-directory: agtermCore
        run: swift test --enable-code-coverage
      - name: export lcov
        working-directory: agtermCore
        # rewrite the absolute SF: paths llvm-cov emits to repo-relative so the
        # separate linux coverage job can resolve them against its own checkout
        run: |
          BIN=$(swift build --show-bin-path)
          xcrun llvm-cov export \
            "$BIN/agtermCorePackageTests.xctest/Contents/MacOS/agtermCorePackageTests" \
            -instr-profile "$BIN/codecov/default.profdata" \
            -format=lcov \
            -ignore-filename-regex='(\.build|Tests|checkouts)/' \
            | sed "s|SF:$GITHUB_WORKSPACE/|SF:|g" > coverage.lcov
      - name: upload lcov artifact
        # coverage is best-effort: a transient artifact-service outage must not
        # red the build when the tests themselves passed
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: agtermCore/coverage.lcov

  coverage:
    name: Coverage upload
    needs: [changes, test]
    if: needs.changes.outputs.swift == 'true'
    # the coveralls action installs its reporter via a brew tap on macOS (now blocked
    # by homebrew's tap-trust gate); on linux it downloads a binary, so upload here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        # the upload side is best-effort; if the artifact never landed, don't fail
        # this job either — the coveralls submit below is already continue-on-error
        continue-on-error: true
        with:
          name: coverage-lcov
      - name: submit coverage to coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov

  lint:
    name: swiftlint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install swiftlint
        run: brew install swiftlint
      - name: swiftlint (strict)
        run: swiftlint lint --strict

  build:
    name: Build app
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Cache libghostty (GhosttyKit + resources)
        uses: actions/cache@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
          key: ghosttykit-${{ hashFiles('scripts/setup.sh') }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build libghostty + app (Release)
        run: scripts/build.sh
      # agtermctl is a standalone CLI on the user's PATH. Passing --entitlements to the --deep
      # re-seal in project.yml stamps the app's TCC entitlements onto it, with a fully green build
      # (issue #396). Nothing else notices, so assert it here.
      - name: Verify agtermctl carries no entitlements
        shell: bash
        run: |
          helper=build/DerivedData/Build/Products/Release/agterm.app/Contents/MacOS/agtermctl
          # without this the check passes silently if the build path ever moves
          [ -f "$helper" ] || { echo "agtermctl not found at $helper" >&2; exit 1; }
          if codesign -d --entitlements - "$helper" 2>/dev/null | grep -q 'com.apple.security'; then
            echo "agtermctl carries entitlements: the app re-seal must not pass --entitlements to a --deep sign" >&2
            exit 1
          fi
      # the Debug-only hardened-runtime exceptions (allow-jit, allow-unsigned-executable-memory,
      # disable-library-validation) must never reach a shipped build, and the TCC set must not shrink
      # either — losing one silently removes the user's only path to granting that permission (#396).
      # Pin the exact Release set; adding or dropping a key is a deliberate act that edits this list.
      - name: Verify the app's Release entitlements
        shell: bash
        run: |
          app=build/DerivedData/Build/Products/Release/agterm.app
          [ -d "$app" ] || { echo "app not found at $app" >&2; exit 1; }
          # values and their types, not just names. A key set to <false/> is not granted and macOS treats
          # it exactly like a missing one, so a name-only compare would pass that through; and codesign
          # accepts <string>true</string>, which renders as bare true without the tojson below.
          expected=$(printf '%s=true\n' \
            com.apple.security.automation.apple-events \
            com.apple.security.device.audio-input \
            com.apple.security.device.camera \
            com.apple.security.personal-information.addressbook \
            com.apple.security.personal-information.calendars \
            com.apple.security.personal-information.location \
            com.apple.security.personal-information.photos-library)
          # get-task-allow is added by the ad-hoc "Sign to Run Locally" identity this job builds with,
          # and never survives the Developer ID re-sign in scripts/release.sh. Drop it, then match exactly.
          actual=$(codesign -d --entitlements - --xml "$app" 2>/dev/null \
            | plutil -convert json -o - -- - \
            | jq -r 'to_entries[] | select(.key != "com.apple.security.get-task-allow")
                     | "\(.key)=\(.value|tojson)"' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Release entitlements changed. expected:" >&2; echo "$expected" >&2
            echo "actual:" >&2; echo "$actual" >&2
            exit 1
          fi
      # the split states the shipping set twice, and only the Release copy is pinned above. A TCC key
      # added to the shipping file and missed here leaves Debug unable to prompt for it, with every job
      # green — the failure surfaces only when someone verifies the new permission by hand in a Debug
      # instance. Derive Debug's expected content from the shipping file so the two cannot drift.
      - name: Verify the Debug entitlements are the shipping set plus the exceptions
        shell: bash
        run: |
          keys() { plutil -convert json -o - -- "$1" | jq -r 'to_entries[] | "\(.key)=\(.value|tojson)"' | sort; }
          release=$(keys agterm/agterm.entitlements)
          debug=$(keys agterm/agterm-debug.entitlements)
          exceptions=$(printf '%s=true\n' \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory \
            com.apple.security.cs.disable-library-validation | sort)
          expected=$(printf '%s\n%s\n' "$release" "$exceptions" | sort)
          if [ "$debug" != "$expected" ]; then
            echo "agterm-debug.entitlements is not the shipping set plus the three exceptions." >&2
            diff <(echo "$expected") <(echo "$debug") >&2 || true
            exit 1
          fi
      - name: Application-hosted unit tests
        run: scripts/test-app.sh

  cookbook:
    name: Cookbook checks
    needs: changes
    if: needs.changes.outputs.cookbook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: recipe layout, index and headings
        # bash explicitly: the block below uses process substitution, and pipefail
        # is what makes a failed find in a command substitution red the step
        shell: bash
        run: |
          fail=0

          # directory set vs index set, BOTH directions
          dirs=$(find cookbook -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          # links come ONLY from canonical table rows, so a link in prose, an html
          # comment or a fenced example cannot satisfy the check
          links=$(grep -E '^\|' cookbook/README.md 2>/dev/null \
                  | grep -oE '\]\([a-z0-9][a-z0-9-]*/\)' \
                  | sed -e 's/^](//' -e 's|/)$||' | sort -u || true)
          missing=$(comm -23 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          stale=$(comm -13 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          for n in $missing; do echo "::error::$n is missing from the index"; fail=1; done
          for n in $stale;   do echo "::error::index row '$n' points at no such directory"; fail=1; done

          for d in cookbook/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if printf '%s' "$name" | grep -qE '[^a-z0-9-]|--|^-|-$'; then
              echo "::error::$name is not kebab-case"; fail=1
            fi
            if [ ! -f "$d/README.md" ]; then
              echo "::error::$name has no README.md"; fail=1; continue
            fi
            for h in "## What it does" "## Requirements" "## Setup" \
                     "## Usage" "## How it works" "## Limits"; do
              if ! grep -qxF "$h" "$d/README.md"; then
                echo "::error::$name README is missing the '$h' heading"; fail=1
              fi
            done
          done

          # every script carries a shebang
          while IFS= read -r -d '' f; do
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "::error::$f has no shebang"; fail=1
            fi
          done < <(find cookbook -type f \( -name '*.sh' -o -name '*.zsh' -o -name '*.py' \) -print0)

          exit $fail
      - name: shellcheck
        # bash explicitly, for pipefail: xargs -0 -r exits 0 on empty input, so
        # without it a failed find would leave the step green having checked nothing
        shell: bash
        run: find cookbook -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Install zsh
        # not on the ubuntu-latest image, unlike shellcheck
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh syntax check
        # shellcheck cannot parse zsh, so a parse is the only gate .zsh recipes get.
        # -n1 because zsh -n reads one script and treats the rest as its arguments;
        # bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.zsh' -print0 | xargs -0 -r -n1 zsh -n
      - name: Install ruff
        # not on the ubuntu-latest image, unlike shellcheck. pipx, because the runner's
        # python is externally managed and a bare pip install into it fails
        run: pipx install ruff
      - name: ruff
        # the .py counterpart of shellcheck, so a recipe is linted rather than only parsed.
        # EXE001 is ignored because it fails a shebang on a non-executable file, which
        # collides head-on with the shebang the layout step requires of every script, and
        # would move executable-bit policy into CI where this repo deliberately keeps it
        # out. bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.py' -print0 | xargs -0 -r ruff check --ignore EXE001
      - name: Python recipe tests
        # One process per file keeps recipes independent and gives each test script its own argv.
        # Bash explicitly, for pipefail, same reason as the ruff step above.
        shell: bash
        run: find cookbook -type f -name 'test_*.py' -print0 | xargs -0 -r -n1 python3
